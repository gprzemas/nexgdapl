# 20260731
name:  build-test-deploy

on: 
  schedule:
    - cron: "8 12,13 * * *"
      timezone: "Europe/Warsaw"

jobs:
  build:
    runs-on: ubintu-latest
    steps:
      - name:  check out of repo
        uses: actions/checkout@v4
        
      - name: use node.js
        uses: actions/setup-node@v4
        with: 
          node-revision: '20.x'
      - run:  npm install
      - run:  npm run build

  test:
    needs: build
    runs-on: ubintu-latest
    steps:
      - name:  check out of repo
        uses: actions/checkout@v4
        
      - name: use node.js
        uses: actions/setup-node@v4
        with: 
          node-revision: '20.x'
      - run:  npm install
      - run:  npm test

  deploy:
    needs: test
    permissions: 
      contents: write
      pages: write
      id-token: write
    environment: 
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name:  check out of repo
        uses: actions/checkout@v4
        with: 
          token: ${{secrets.GITHUB_TOKEN}}
      - name: use node.js
        uses: actions/setup-node@v4      
        with: 
          node-revision: '20.x'

      - name: configure github pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
      - run: npm install
      - run: npm run build
      
      - name: upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'
  
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
    

